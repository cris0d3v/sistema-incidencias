name: API CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/serve-api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'cris0d3v/sistema-incidencias'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter serve-api run build
