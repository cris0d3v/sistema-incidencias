services:
  api:
    build:
      context: .
      dockerfile: apps/serve-api/dockerfile
    image: sistema-incidencias-api:latest
    environment:
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/client_view/dockerfile
    image: sistema-incidencias-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
